[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mtools-gui"
version = "0.2.0"
description = "Two-pane file manager for exchanging files between Linux and a DOS/FAT partition on a removable drive, via mtools."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    # PySide6-Essentials (QtCore/QtGui/QtWidgets - all we use), not the
    # full "PySide6" meta-package: that one also pulls in PySide6-Addons
    # (WebEngine, Multimedia, 3D, ...), which we never import and which
    # roughly doubles the install/download size for no benefit.
    "PySide6-Essentials>=6.6",
]

[project.scripts]
mtools-gui = "mtools_gui.app:main"
mtools-gui-install-helper = "mtools_gui.install_helper:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mtools_gui"]

[tool.hatch.build.targets.wheel.force-include]
"src/mtools_gui/system_files/mtools-gui-helper" = "mtools_gui/system_files/mtools-gui-helper"
"src/mtools_gui/system_files/49-mtools-gui.rules" = "mtools_gui/system_files/49-mtools-gui.rules"

[tool.pytest.ini_options]
testpaths = ["tests"]
