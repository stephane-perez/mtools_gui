name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Safety net: a test that pops a real (unmocked) blocking dialog
    # under the "offscreen" platform hangs forever rather than failing -
    # confirmed against a real run that sat for ~28 minutes before being
    # manually cancelled (see tests/conftest.py's _pretend_helper_is_installed,
    # which fixes the specific cause found). This bounds the damage if a
    # similar hang is ever introduced again, instead of burning the full
    # default 6-hour job timeout.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # PySide6 still dynamically links a handful of system shared
      # libraries even under Qt's "offscreen" platform plugin (no real
      # X server/Wayland needed) - these are the ones tests here have
      # been observed to need on a minimal Ubuntu runner.
      - name: Install headless Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libfreetype6

      - name: Install mtools_gui with test dependencies
        run: python -m pip install -e ".[test]"

      - name: Build the wheel (catches packaging metadata regressions)
        run: |
          python -m pip install --upgrade build
          python -m build --wheel

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  pipx-install:
    name: pipx install . (smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install headless Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libfreetype6

      - name: Install pipx
        run: python -m pip install --upgrade pipx

      - name: pipx install .
        run: pipx install .

      - name: Verify the entry-point scripts were installed
        run: |
          command -v mtools-gui
          command -v mtools-gui-install-helper

      # No real SD card or mtools binary needed for this: it only proves
      # the pipx-installed executable starts (imports resolve, the Qt
      # application and main window construct) without crashing. The
      # left pane (local files) already works with nothing else
      # installed - only the DOS-side helper needs a real machine.
      - name: Smoke-test launching the installed GUI headless
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mtools-gui &
          pid=$!
          sleep 3
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "mtools-gui exited on its own during startup" >&2
            exit 1
          fi
          kill "$pid"
          wait "$pid" 2>/dev/null || true
